<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tâches</title>
  <meta name="description" content="Tâches : vos tâches classées et à portée de main, sur ordinateur comme sur téléphone.">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Thème et taille du texte appliqués avant l'affichage (évite un flash).
    (function () {
      var p = {};
      try { p = JSON.parse(localStorage.getItem('taches.prefs') || '{}') || {}; } catch (e) {}
      var dark = p.theme === 'dark' || (p.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var sizes = { s: 14, m: 16, l: 18, xl: 20 };
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.fontSize = (sizes[p.fontSize] || 16) + 'px';
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><div class="boot"><div class="spinner" aria-label="Chargement"></div></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:1rem;text-align:center">Tâches nécessite JavaScript.</p></noscript>
</body>
</html>
